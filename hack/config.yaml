# fastvm demo configuration.
#
# Used by `make start` and the walkthrough in docs/GETTING_STARTED.md. It keeps
# all state under /tmp so trying fastvm needs no system-wide installation; for a
# real deployment copy this to /etc/fastvm/config.yaml and point
# data_dir/kernel_path/agent_path at /var/lib/fastvm/....
#
# Relative paths are resolved from the daemon's working directory, so run
# fastvmd from the repository root:
#   sudo bin/fastvmd -config hack/config.yaml
#
# The daemon needs root or CAP_NET_ADMIN (TAP/bridge/nftables) and, for the
# eBPF switch, CAP_BPF; without CAP_BPF it automatically falls back to the
# Linux bridge. Cloud Hypervisor v54+ (and virtiofsd when host-directory volumes
# are used) must be installed; see the vmm section below.

data_dir: /tmp/fastvm-cow/data
socket_path: /run/fastvm/fastvm.sock
kernel_path: test/e2e/assets/vmlinux.bin
agent_path: bin/fastvm-agent

# VMM backend. Cloud Hypervisor is the only supported backend. The binary is
# looked up on PATH (`cloud-hypervisor`, then `cloud-hypervisor-static`) and can
# be overridden with an absolute path or FASTVM_CLOUD_HYPERVISOR.
vmm:
  binary: cloud-hypervisor
  # virtiofsd serves host-directory volumes (virtio-fs). Needed only when a
  # sandbox has volumes; override with an absolute path (e.g. /usr/lib/virtiofsd)
  # when it is not on PATH.
  virtiofsd: virtiofsd

# Host-directory volumes (virtio-fs). Each volume's host_path must be an
# absolute path under one of these prefixes; an empty list denies all host
# mounts. Add /tmp here to try host shares in demos, e.g.
#   allowed_host_prefixes: [/tmp]
volumes:
  # Host-directory mounts are opt-in: empty denies all. Local dev prefixes:
  # /tmp for throwaway shares, and this machine's fastvm checkout so a sandbox
  # can mount the source. Replace/remove the checkout path before committing.
  allowed_host_prefixes:
    - /tmp
    - /home/anh/Code/fastvm

lifecycle:
  # Generous windows: a coding-agent VM should not pause after a few seconds of
  # idle. Shorten them in your own config if you want faster auto-sleep.
  idle_window: 60s
  pause_after: 10m
  offload_after: 30m
  destroy_after: 0s
  on_workload_exit: idle

idle:
  cpu_threshold_pct: 1.0
  cpu_wake_pct: 5.0
  sample_interval: 1s
  exit_hold: 3s
  warmup: 1s
  block_io_bytes: 65536
  keepalive_aware: true

memory:
  offload_mode: file

wake:
  tcp: true
  udp: true
  icmp: true
  max_wakes_per_minute: 6
  coalesce_window: 100ms

# CoW runtime-volume settings (not to be confused with the top-level `volumes`
# host-directory shares above).
volume:
  cow: reflink
  size_gb: 8
  discard_on_destroy: true

switch:
  # eBPF is the default data plane. Without CAP_BPF/BTF (or when the verifier
  # rejects the program) fastvmd automatically falls back to the Linux bridge
  # + AF_PACKET wake path.
  mode: bridge
  isolate_sandboxes: true
  wake_notify: true

# Optional REST JSON API over TCP. The unix socket is always available; TCP is
# mTLS-only and disabled when host is empty. cert_path must contain:
#   ca.pem    CA used to verify client certificates
#   cert.pem  server certificate
#   key.pem   server private key
api:
  host: 127.0.0.1:8443
  cert_path: /tmp/fastvm/certs/server

network:
  # Empty dns/search mirrors the host's /etc/resolv.conf (loopback resolvers
  # are filtered, with public fallback), like Docker. Override to pin resolvers.
  dns: []
  search: []
